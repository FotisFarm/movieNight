services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - MN_PASSWORD=${MN_PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret}
      - GUEST_PASSWORD=${GUEST_PASSWORD:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

  sakias:
    build: .
    ports:
      - "${SAKIAS_PORT:-3001}:3000"
    volumes:
      - sqlite_data:/app/main-data:ro
      - sakias_data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - MN_PASSWORD=${MN_PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret}
      - GUEST_PASSWORD=${GUEST_PASSWORD:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - VOTERS=Μητσέας,Παντελής,Στέλιας,Φώτης,Λεόντιος,Σάκιας
      - GROUP_SIZE=6
    restart: unless-stopped

volumes:
  sqlite_data:
  sakias_data:
