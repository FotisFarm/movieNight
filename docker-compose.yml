services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Local-file fallback only — used when TURSO_DATABASE_URL is unset.
      # Production (Render) points at Turso instead; no volume needed there.
      - sqlite_data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      # Group membership. Unset = the five names and GROUP_SIZE=5 baked into
      # server/config.js; set both together when a voter joins or leaves.
      - VOTERS=${VOTERS:-}
      - GROUP_SIZE=${GROUP_SIZE:-}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - TURSO_READONLY_AUTH_TOKEN=${TURSO_READONLY_AUTH_TOKEN:-}
      - MN_PASSWORD=${MN_PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret}
      - GUEST_PASSWORD=${GUEST_PASSWORD:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - HIDE_HAL=${HIDE_HAL:-false}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-mn_sid}
    restart: unless-stopped

  # 6th-member sandbox environment (Κλαίρη)
  # Reads live catalog and production data in real-time, but isolates all ratings,
  # Top 10 picks, watchlist votes, and rating history into sandbox tables/views
  # with GROUP_SIZE=6, ensuring zero data pollution to the 5-member prod environment.
  app-v6:
    build: .
    ports:
      - "${V6_PORT:-3002}:3000"
    volumes:
      - sqlite_data_v6:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - SANDBOX_MODE=true
      - SANDBOX_VOTER=${V6_VOTER:-Κλαίρη}
      - VOTERS=${V6_VOTERS:-Μητσέας,Παντελής,Στέλιας,Φώτης,Λεόντιος,Κλαίρη}
      - GROUP_SIZE=${V6_GROUP_SIZE:-6}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - TURSO_READONLY_AUTH_TOKEN=${TURSO_READONLY_AUTH_TOKEN:-}
      - MN_PASSWORD=${V6_MN_PASSWORD:-${MN_PASSWORD:-changeme}}
      - SESSION_SECRET=${V6_SESSION_SECRET:-change-this-secret-v6}
      - SESSION_COOKIE_NAME=${V6_SESSION_COOKIE_NAME:-mn_v6_sid}
      - GUEST_PASSWORD=${GUEST_PASSWORD:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - HIDE_HAL=${HIDE_HAL:-false}
    restart: unless-stopped

volumes:
  sqlite_data:
  sqlite_data_v6:
