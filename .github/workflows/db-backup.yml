name: DB Backup

# Daily snapshot of the production Turso database. Replaces the old
# SSH-into-the-server-and-cat-a-Docker-volume approach, which had no valid
# target once hosting moved to Render and the DB moved to Turso.
#
# Two outputs, both produced by server/scripts/backup-and-seed.js:
#   1. movies_YYYY-MM-DD.sql -> `backups` branch (7-day rolling window)
#   2. refreshed server/data/seed.json -> `main`, so a fresh clone runs locally
#      with current data. That commit carries [skip render] so the daily refresh
#      does NOT redeploy the app — sessions are in-memory and a redeploy would
#      log every voter out each morning.
#
# Required repo secrets: TURSO_DATABASE_URL, TURSO_READONLY_AUTH_TOKEN

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: Dump database and regenerate seed
        working-directory: server
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_AUTH_TOKEN }}
          OUT_SQL: ${{ github.workspace }}/movies_dump.sql
        run: node scripts/backup-and-seed.js

      - name: Commit refreshed seed.json to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- server/data/seed.json; then
            echo "seed.json unchanged — nothing to commit"
          else
            git add server/data/seed.json
            git commit -m "Refresh seed.json from production [skip render]"
            git push origin main
          fi

      - name: Checkout backups branch
        uses: actions/checkout@v4
        with:
          ref: backups
          path: backups-branch

      - name: Commit snapshot and prune old ones
        working-directory: backups-branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp "${{ github.workspace }}/movies_dump.sql" "movies_$(date +%Y-%m-%d).sql"

          # Prune .sql snapshots older than 7 days. The legacy movies_*.db files
          # from the pre-Turso workflow are left alone on purpose — they are the
          # only surviving record of the database before the migration.
          cutoff=$(date -d '7 days ago' +%Y-%m-%d)
          for f in movies_*.sql; do
            [[ "$f" =~ movies_([0-9]{4}-[0-9]{2}-[0-9]{2})\.sql ]] || continue
            if [[ "${BASH_REMATCH[1]}" < "$cutoff" ]]; then
              git rm -f "$f" && echo "Pruned $f"
            fi
          done

          git add movies_*.sql
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "DB snapshot $(date +%Y-%m-%d)"
            git push origin backups
          fi
