# DEPRECATED: hosting moved to Render, which auto-deploys from GitHub on
# its own (or via a deploy hook) — this SSH-into-the-old-server workflow no
# longer has a valid target. Push-triggering is disabled; left as
# workflow_dispatch only in case the old host is ever needed again.
name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_KEY:  ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" bash <<'ENDSSH'
            set -e
            cd ~/movieNight
            git pull
            docker compose down
            docker compose up --build -d
            echo "Deploy complete"
          ENDSSH
